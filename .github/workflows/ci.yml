name: CI

# Pengujian otomatis setiap Pull Request ke main dan setiap perubahan di main.
# Terisolasi penuh: memakai MongoDB sementara milik GitHub Actions, nilai env palsu,
# dan tidak memakai secret apa pun. Tidak melakukan deployment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tes API terisolasi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paket Python (versi sama dengan requirements.txt)
        run: |
          bash scripts/ci_backend_requirements.sh > /tmp/req-ci.txt
          cat /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: Cek sintaks Python
        run: python -m py_compile backend/server.py backend/static/voucher_print_agent.py

      - name: Tes API (MongoDB sementara)
        env:
          CI_MONGO_URL: mongodb://127.0.0.1:27017
          CI_DB_NAME: ci_test_voucher88
        run: pytest -c backend/tests/ci/pytest.ini backend/tests/ci -v

  scripts:
    name: Skrip sinkron Emergent (tes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh

      - name: Tes emergent_sync.sh (repo git tiruan, tanpa jaringan luar)
        run: bash scripts/tests/test_emergent_sync.sh

  frontend:
    name: Frontend (build produksi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install paket frontend
        run: |
          if yarn install --frozen-lockfile --non-interactive --network-timeout 120000; then
            echo "yarn install sesuai yarn.lock berhasil"
          else
            # Paket dev @emergentbase/visual-edits diunduh dari server Emergent dan hanya
            # dipakai mode dev. Bila server itu tidak bisa diakses dari GitHub, paket itu
            # dilepas HANYA di salinan CI ini (tidak di-commit) lalu install diulang.
            echo "::warning::Install sesuai lockfile gagal; mencoba tanpa @emergentbase/visual-edits (khusus CI)"
            node -e 'const f="package.json",p=require("./"+f);delete p.devDependencies["@emergentbase/visual-edits"];require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
            yarn install --non-interactive --network-timeout 120000
          fi

      - name: Build produksi
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://ci.example.invalid
        run: yarn build

  railway-docker:
    name: Railway (Docker end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image backend (sama seperti Railway)
        run: docker build -t v88-backend backend

      - name: Build image frontend (sama seperti Railway)
        run: docker build -t v88-frontend frontend

      - name: Jalankan MongoDB uji sementara, backend, frontend
        # Semua nilai di sini palsu/khusus CI. Database dibuang bersama runner.
        run: |
          docker network create v88
          docker run -d --name mongo --network v88 mongo:7
          docker run -d --name backend --network v88 \
            -e MONGO_URL=mongodb://mongo:27017 -e DB_NAME=ci_test_e2e \
            -e JWT_SECRET=ci-only-jwt-secret -e ADMIN_PASSWORD=135790 \
            -e EMAIL_PROVIDER=disabled -e CORS_ORIGINS=https://staging.example.invalid \
            v88-backend
          docker run -d --name frontend --network v88 -p 8080:8080 \
            -e BACKEND_INTERNAL_URL=http://backend:8001 v88-frontend
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/ >/dev/null && exit 0
            sleep 2
          done
          echo "Layanan tidak siap dalam 120 detik"; exit 1

      - name: Smoke test (login lewat proxy, cookie, QR domain baru)
        env:
          SMOKE_ADMIN_PASSWORD: "135790"
          SMOKE_HOST_HEADER: staging.example.invalid
        run: bash scripts/railway_smoke_test.sh http://localhost:8080 --write

      - name: Log container (bila gagal)
        if: failure()
        run: |
          for c in backend frontend mongo; do
            echo "===== $c"; docker logs "$c" 2>&1 | tail -n 60
          done

  railway-single:
    name: Railway satu service (Docker end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image satu service (sama seperti Railway, via /railway.json)
        run: docker build -f deploy/railway.Dockerfile -t v88-app .

      - name: Jalankan MongoDB uji + aplikasi HANYA dengan 2 variabel
        # Nilai khusus CI. Tidak ada JWT_SECRET/DB_NAME/CORS: harus otomatis.
        run: |
          docker network create v88
          docker run -d --name mongo --network v88 mongo:7
          docker run -d --name app --network v88 -p 8080:8000 \
            -e MONGO_URL=mongodb://mongo:27017 -e ADMIN_PASSWORD=135790 v88-app
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/ >/dev/null && exit 0
            sleep 2
          done
          echo "Aplikasi tidak siap dalam 120 detik"; exit 1

      - name: Smoke test (login, cookie, QR domain baru)
        env:
          SMOKE_ADMIN_PASSWORD: "135790"
          SMOKE_HOST_HEADER: staging.example.invalid
          # Meniru proxy depan Railway, yang selalu meneruskan X-Forwarded-Proto: https.
          SMOKE_FORWARDED_PROTO: https
        run: bash scripts/railway_smoke_test.sh http://localhost:8080 --write

      - name: Tidak ada CORS terbuka + login tetap berlaku setelah restart
        run: |
          if curl -s -D - -o /dev/null -H "Origin: https://evil.example" http://localhost:8080/api/ | grep -qi '^access-control-allow-origin'; then
            echo "CORS terbuka untuk domain lain"; exit 1
          fi
          printf '{"name":"Admin","password":"135790"}' > /tmp/login.json
          COOKIE="$(curl -s -D - -o /dev/null -H 'Content-Type: application/json' --data-binary @/tmp/login.json http://localhost:8080/api/auth/login \
            | grep -i '^set-cookie: access_token=' | sed -E 's/^[Ss]et-[Cc]ookie: ([^;]*).*/\1/' | tr -d '\r')"
          [ -n "$COOKIE" ] || { echo "Login gagal"; exit 1; }
          docker restart app
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/ >/dev/null && break; sleep 2; done
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $COOKIE" http://localhost:8080/api/auth/me)"
          [ "$CODE" = 200 ] || { echo "Sesi login hilang setelah restart (HTTP $CODE)"; exit 1; }
          echo "OK: tanpa CORS terbuka, sesi tetap berlaku setelah restart"

      - name: Log container (bila gagal)
        if: failure()
        run: |
          for c in app mongo; do
            echo "===== $c"; docker logs "$c" 2>&1 | tail -n 60
          done
